<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Retail Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { font-family:'Segoe UI',sans-serif; background:#f8fafc; }

.navbar { background:#1e293b; }
.navbar-brand, .nav-link { color:white !important; }
.nav-link:hover { color:#93c5fd !important; }

.page-hero {
    background: linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)), url('image1.jpg');
    background-size:cover;
    background-position:center;
    color:white;
    text-align:center;
    padding:60px 20px;
}
.page-hero h1 { font-size:48px; font-weight:bold; }

.contact-card { background:white; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.08); padding:40px; }

footer { background:#1e293b; color:white; padding:20px; text-align:center; margin-top:60px; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
<div class="container">
<a class="navbar-brand" href="index.html">🛒 Retail Shop</a>
<button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
<li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
<li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
<li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
<li class="nav-item"><a class="nav-link" href="About_us.html">About Us</a></li>
<li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
</ul>
</div>
</div>
</nav>

<section class="page-hero">
<h1>📬 Contact Us</h1>
<p>We'd love to hear from you</p>
</section>

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-md-7">
<div class="contact-card">
<h3 class="mb-4" style="color:#1e293b; border-left:4px solid #2563eb; padding-left:14px;">Send Us a Message</h3>
<div class="mb-3">
<label class="form-label fw-semibold">Name</label>
<input type="text" class="form-control" placeholder="Your full name">
</div>
<div class="mb-3">
<label class="form-label fw-semibold">Email</label>
<input type="email" class="form-control" placeholder="your@email.com">
</div>
<div class="mb-3">
<label class="form-label fw-semibold">Message</label>
<textarea class="form-control" rows="5" placeholder="How can we help you?"></textarea>
</div>
<button class="btn btn-primary btn-lg w-100">Send Message</button>
</div>
</div>
</div>
</div>

<footer>
<p>© 2026 Retail Shop | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
