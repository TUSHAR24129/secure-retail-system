<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Retail Shop</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:#f8fafc; }

header {
    background:#111827;
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo { font-size:28px; font-weight:bold; }
nav a { color:white; text-decoration:none; margin-left:25px; }
nav a:hover { color:#3b82f6; }

.container { width:90%; margin:auto; padding:50px 0; }
.section-title { text-align:center; margin-bottom:40px; font-size:36px; }

.order-card {
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    margin-bottom:25px;
}
.order-header {
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    flex-wrap:wrap;
    gap:10px;
}
.order-status {
    color:white;
    padding:6px 14px;
    border-radius:20px;
    font-size:14px;
    font-weight:600;
    text-transform:capitalize;
}
.status-delivered      { background:#22c55e; }
.status-pending        { background:#f59e0b; }
.status-processing     { background:#3b82f6; }
.status-packed         { background:#8b5cf6; }
.status-out_for_delivery { background:#06b6d4; }
.status-cancelled      { background:#ef4444; }

.order-details p { margin:8px 0; color:#555; }

.btn-view {
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    margin-top:15px;
    border:none;
    cursor:pointer;
    font-size:14px;
}
.btn-view:hover { background:#1d4ed8; }

/* Modal */
.modal-backdrop {
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    z-index:1000;
    align-items:center;
    justify-content:center;
}
.modal-backdrop.show { display:flex; }
.modal-box {
    background:white;
    border-radius:15px;
    padding:30px;
    width:90%;
    max-width:550px;
    max-height:80vh;
    overflow-y:auto;
}
.modal-box h3 { margin-bottom:15px; }
.modal-box table { width:100%; border-collapse:collapse; font-size:14px; }
.modal-box th, .modal-box td { padding:8px 10px; border-bottom:1px solid #e5e7eb; text-align:left; }
.modal-box th { background:#f1f5f9; }
.modal-close {
    float:right;
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
    color:#666;
}
.spinner { text-align:center; padding:20px; color:#888; }

footer { background:#111827; color:white; text-align:center; padding:20px; margin-top:50px; }

@media(max-width:768px) {
    nav { display:none; }
    .order-header { flex-direction:column; }
}
</style>
</head>
<body>

<header>
  <div class="logo">🛒 Retail Shop</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="orders.html">Orders</a>
    <a href="login.html">Login</a>
    <a href="contact.html">Contact</a>
    <a href="about_us.html">About Us</a>
  </nav>
</header>

<div class="container">
  <h2 class="section-title">My Orders</h2>
  <div id="orders-list">
    <div class="spinner">Loading orders...</div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer>
  <p>© 2026 Retail Shop | All Rights Reserved</p>
</footer>

<script>
const API = 'http://localhost:3000';
const userId = localStorage.getItem('userId') || 3;

const statusClass = {
  delivered:        'status-delivered',
  pending:          'status-pending',
  processing:       'status-processing',
  packed:           'status-packed',
  out_for_delivery: 'status-out_for_delivery',
  cancelled:        'status-cancelled'
};

async function loadOrders() {
  try {
    const res = await fetch(`${API}/api/orders`);
    const data = await res.json();
    // Filter to current user's orders
    const orders = data.orders.filter(o => String(o.user_id) === String(userId) ||
      // fallback: show all if user_id not in response
      !('user_id' in o));
    // If API doesn't return user_id, show all orders
    const list = orders.length ? orders : data.orders;
    renderOrders(list);
  } catch (e) {
    document.getElementById('orders-list').innerHTML = `
      <div style="text-align:center;padding:40px;color:#888">
        <h4>Could not connect to the server.</h4>
        <p>Make sure <code>node server.js</code> is running.</p>
      </div>`;
  }
}

function renderOrders(orders) {
  if (!orders.length) {
    document.getElementById('orders-list').innerHTML = `
      <div style="text-align:center;padding:40px;color:#888">
        <h4>No orders yet.</h4>
        <a href="products.html" style="color:#2563eb">Start shopping →</a>
      </div>`;
    return;
  }

  document.getElementById('orders-list').innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-header">
        <h3>Order #${o.id}</h3>
        <span class="order-status ${statusClass[o.status] || 'status-pending'}">
          ${o.status.replace(/_/g, ' ')}
        </span>
      </div>
      <div class="order-details">
        <p><strong>Date:</strong> ${new Date(o.created_at).toLocaleDateString('en-AU', {day:'numeric',month:'long',year:'numeric'})}</p>
        <p><strong>Customer:</strong> ${o.username}</p>
        <p><strong>Payment:</strong> ${o.payment_status} · ${o.payment_method}</p>
        <p><strong>Total:</strong> <span style="color:#22c55e;font-weight:bold">$${parseFloat(o.total_amount).toFixed(2)}</span></p>
      </div>
      <button class="btn-view" onclick="viewOrder(${o.id})">View Details</button>
    </div>
  `).join('');
}

async function viewOrder(orderId) {
  document.getElementById('modal-content').innerHTML = '<div class="spinner">Loading...</div>';
  document.getElementById('modal').classList.add('show');
  try {
    const res = await fetch(`${API}/api/orders/${orderId}`);
    const data = await res.json();
    const { order, items } = data;
    document.getElementById('modal-content').innerHTML = `
      <h3>Order #${order.id}</h3>
      <p style="color:#888;margin-bottom:15px">
        ${new Date(order.created_at).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}
        · <span style="text-transform:capitalize">${order.status.replace(/_/g,' ')}</span>
      </p>
      <table>
        <thead><tr><th>Product</th><th>Unit</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
        <tbody>
          ${items.map(i => `
            <tr>
              <td>${i.product}</td>
              <td>${i.unit || '-'}</td>
              <td>${i.quantity}</td>
              <td>$${parseFloat(i.unit_price).toFixed(2)}</td>
              <td>$${parseFloat(i.subtotal).toFixed(2)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="text-align:right;margin-top:15px;font-size:18px;font-weight:bold">
        Total: <span style="color:#22c55e">$${parseFloat(order.total_amount).toFixed(2)}</span>
      </div>
      ${order.delivery_address ? `<p style="margin-top:10px;color:#666"><strong>Deliver to:</strong> ${order.delivery_address}</p>` : ''}
      ${order.delivery_notes  ? `<p style="color:#666"><strong>Notes:</strong> ${order.delivery_notes}</p>` : ''}
    `;
  } catch (e) {
    document.getElementById('modal-content').innerHTML = '<p style="color:red">Failed to load order details.</p>';
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadOrders();
</script>
</body>
</html>
