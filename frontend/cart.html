<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart | Retail Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { font-family:'Segoe UI',sans-serif; background:#f8fafc; }
.navbar { background:#1e293b; }
.navbar-brand, .nav-link { color:white !important; }
.nav-link:hover { color:#93c5fd !important; }
.page-hero {
    background: linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)), url('images/image1.jpg');
    background-size:cover;
    background-position:center;
    color:white;
    text-align:center;
    padding:60px 20px;
}
.page-hero h1 { font-size:48px; font-weight:bold; }
.cart-card { background:white; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.08); padding:30px; }
.btn-remove { padding:2px 10px; font-size:13px; }
footer { background:#1e293b; color:white; padding:20px; text-align:center; margin-top:60px; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">🛒 Retail Shop</a>
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link active" href="cart.html">Cart</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="About_us.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="page-hero">
  <h1>🛒 My Cart</h1>
  <p>Review your items before checkout</p>
</section>

<div class="container py-5">
  <div id="alert-box" class="alert d-none"></div>

  <div class="cart-card">
    <div id="cart-content">
      <div class="text-center py-4">
        <div class="spinner-border text-secondary" role="status"></div>
        <p class="mt-2 text-muted">Loading cart...</p>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Retail Shop | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'http://localhost:3000';
const userId = localStorage.getItem('userId') || 3;

async function loadCart() {
  try {
    const res = await fetch(`${API}/api/cart/${userId}`);
    const data = await res.json();
    renderCart(data);
  } catch (e) {
    document.getElementById('cart-content').innerHTML = `
      <div class="text-center py-4">
        <h5 class="text-muted">Could not connect to the server.</h5>
        <p>Make sure <code>node server.js</code> is running.</p>
      </div>`;
  }
}

function renderCart(data) {
  const { items, item_count, cart_total } = data;

  if (!items || items.length === 0) {
    document.getElementById('cart-content').innerHTML = `
      <div class="text-center py-5">
        <h4 class="text-muted">Your cart is empty.</h4>
        <a href="products.html" class="btn btn-success mt-3">Browse Products</a>
      </div>`;
    return;
  }

  const rows = items.map(item => `
    <tr>
      <td>
        <strong>${item.product}</strong>
        <small class="text-muted d-block">per ${item.unit}</small>
      </td>
      <td>${item.quantity}</td>
      <td>$${parseFloat(item.price).toFixed(2)}</td>
      <td class="text-success fw-bold">$${parseFloat(item.subtotal).toFixed(2)}</td>
      <td>
        <button class="btn btn-outline-danger btn-remove"
          onclick="removeItem(${item.id}, '${item.product}')">Remove</button>
      </td>
    </tr>
  `).join('');

  document.getElementById('cart-content').innerHTML = `
    <table class="table table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>Product</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Subtotal</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="d-flex justify-content-between align-items-center mt-4">
      <div>
        <span class="text-muted">${item_count} item${item_count !== 1 ? 's' : ''}</span>
        <h4 class="mb-0 mt-1">Total: <span class="text-success">$${cart_total}</span></h4>
      </div>
      <button class="btn btn-success btn-lg" onclick="checkout()">Checkout</button>
    </div>`;
}

async function removeItem(productId, productName) {
  try {
    const res = await fetch(`${API}/api/cart/${userId}/${productId}`, { method: 'DELETE' });
    if (res.ok) {
      showAlert(`✅ ${productName} removed from cart.`, 'success');
      loadCart();
    } else {
      showAlert('❌ Could not remove item.', 'danger');
    }
  } catch (e) {
    showAlert('❌ Server error.', 'danger');
  }
}

async function checkout() {
  try {
    const res = await fetch(`${API}/api/cart/${userId}`);
    const data = await res.json();
    if (!data.items || data.items.length === 0) {
      showAlert('Your cart is empty.', 'warning');
      return;
    }
    const orderRes = await fetch(`${API}/api/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id: userId,
        total_amount: data.cart_total,
        payment_method: 'card',
        delivery_address: '123 Main St',
        items: data.items.map(i => ({
          product_id: i.id,
          quantity: i.quantity,
          unit_price: i.price
        }))
      })
    });
    if (orderRes.ok) {
      showAlert('✅ Order placed successfully!', 'success');
      setTimeout(() => { window.location.href = 'orders.html'; }, 1500);
    } else {
      showAlert('❌ Checkout failed. Please try again.', 'danger');
    }
  } catch (e) {
    showAlert('❌ Server error during checkout.', 'danger');
  }
}

function showAlert(msg, type) {
  const box = document.getElementById('alert-box');
  box.className = `alert alert-${type}`;
  box.textContent = msg;
  box.classList.remove('d-none');
  setTimeout(() => box.classList.add('d-none'), 3000);
}

loadCart();
</script>
</body>
</html>
